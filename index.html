<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm.io (Stamina Fixed)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a24;
            font-family: 'Segoe UI', sans-serif; user-select: none;
        }
        canvas { display: block; }
        
        #ui {
            position: absolute; top: 15px; left: 15px;
            color: white; pointer-events: none;
        }
        #scoreBoard {
            background: rgba(0, 0, 0, 0.6); padding: 10px 20px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin: 0; font-size: 24px; }
        
        #boostContainer {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%); width: 300px; height: 20px;
            background: rgba(0, 0, 0, 0.6); border: 2px solid white;
            border-radius: 10px; overflow: hidden; pointer-events: none;
        }
        #boostBar {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff3b30);
            transition: width 0.1s linear, background 0.3s;
        }
        #boostText {
            position: absolute; width: 100%; text-align: center;
            top: -25px; color: white; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }

        #gameOver {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(20, 20, 30, 0.95);
            color: white; padding: 40px 60px; text-align: center;
            border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 2px solid #ff3b30; z-index: 10; pointer-events: auto;
        }
        #gameOver h1 { margin-top: 0; color: #ff3b30; font-size: 40px; }
        button {
            margin-top: 20px; padding: 12px 25px; font-size: 18px;
            font-weight: bold; cursor: pointer; background: #4CAF50;
            border: none; color: white; border-radius: 8px;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreBoard">
            <h2>คะแนน: <span id="score">0</span></h2>
            <h3 style="margin-top:5px; font-size:16px; color:#aaa;">จำนวนหนอนในแมพ: <span id="aliveCount">0</span></h3>
        </div>
    </div>

    <div id="boostContainer">
        <div id="boostText" id="bText">BOOST ENERGY</div>
        <div id="boostBar"></div>
    </div>

    <div id="gameOver">
        <h1>จบเกม!</h1>
        <h2>คะแนนรวม: <span id="finalScore">0</span></h2>
        <button onclick="location.reload()">เล่นใหม่อีกครั้ง</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize); resize();

        const WORLD_SIZE = 15000;
        const FOOD_COUNT = 5000;
        const BOT_MAX_COUNT = 40;
        const BOT_SPAWN_DELAY = 3000;
        
        let score = 0;
        let isGameOver = false;
        let lastBotSpawnTime = Date.now(); 

        let mouseX = width / 2, mouseY = height / 2;
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if(e.button === 0 && !player.dead) player.isBoosting = true;
        });
        window.addEventListener('mouseup', (e) => {
            if(e.button === 0 && !player.dead) player.isBoosting = false;
        });

        const foods = [];
        const foodColors = ['#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#e1a6fc'];

        function spawnFood(x, y, color, sizeMultiplier = 1) {
            foods.push({
                x: x ?? Math.random() * WORLD_SIZE,
                y: y ?? Math.random() * WORLD_SIZE,
                radius: (Math.random() * 5 + 4) * sizeMultiplier,
                color: color ?? foodColors[Math.floor(Math.random() * foodColors.length)]
            });
        }
        for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

        let worms = [];
        
        function createWorm(isPlayer = false) {
            const baseSpd = isPlayer ? 2.0 : 1.2 + (Math.random() * 0.6); 
            
            return {
                isPlayer: isPlayer,
                x: isPlayer ? WORLD_SIZE / 2 : Math.random() * WORLD_SIZE,
                y: isPlayer ? WORLD_SIZE / 2 : Math.random() * WORLD_SIZE,
                radius: 15,
                angle: Math.random() * Math.PI * 2,
                targetAngle: Math.random() * Math.PI * 2,
                
                baseSpeed: baseSpd,
                boostSpeed: baseSpd * 1.8, 
                speed: baseSpd,
                
                energy: 100,
                isBoosting: false,
                exhausted: false, // เพิ่มสถานะหมดแรง
                
                history: [],
                length: 20,
                segmentSpacing: 4,
                color: isPlayer ? '#00ff88' : `hsl(${Math.random() * 360}, 80%, 50%)`,
                dead: false
            };
        }

        const player = createWorm(true);
        worms.push(player);
        for(let i = 0; i < 15; i++) worms.push(createWorm(false));

        function update() {
            if (isGameOver) return;

            if (worms.length <= BOT_MAX_COUNT && Date.now() - lastBotSpawnTime > BOT_SPAWN_DELAY) {
                worms.push(createWorm(false));
                lastBotSpawnTime = Date.now();
            }

            document.getElementById('aliveCount').innerText = worms.filter(w => !w.dead).length;

            for (let i = 0; i < worms.length; i++) {
                let w = worms[i];
                if (w.dead) continue;

                if (w.isPlayer) {
                    const dx = mouseX - (width / 2);
                    const dy = mouseY - (height / 2);
                    w.targetAngle = Math.atan2(dy, dx);
                } else {
                    const margin = 1000; 
                    if (w.x < margin || w.x > WORLD_SIZE - margin || w.y < margin || w.y > WORLD_SIZE - margin) {
                        w.targetAngle = Math.atan2((WORLD_SIZE / 2) - w.y, (WORLD_SIZE / 2) - w.x);
                        w.isBoosting = false; 
                    } else {
                        if (Math.random() < 0.03) w.targetAngle += (Math.random() - 0.5) * 1.5;
                        if (Math.random() < 0.005 && w.energy > 60 && !w.exhausted) w.isBoosting = true;
                        if (w.energy < 20 || Math.random() < 0.02) w.isBoosting = false;
                    }
                }

                // ตรวจสอบสถานะเหนื่อยล้า (หลอดหมด)
                if (w.energy <= 0) {
                    w.exhausted = true; // หมดแรง ห้ามพุ่ง
                } else if (w.energy > 30) {
                    w.exhausted = false; // ฟื้นฟูถึง 30% ถึงจะพุ่งใหม่ได้
                }

                // เช็คว่าพุ่งได้จริงไหม (กดพุ่ง + ไม่เหนื่อยล้า + พลังงานมากกว่า 0)
                let actuallyBoosting = w.isBoosting && !w.exhausted && w.energy > 0;

                if (actuallyBoosting) {
                    w.speed = w.boostSpeed;
                    w.energy -= 1.0; 
                } else {
                    w.speed = w.baseSpeed;
                    if (w.energy < 100) {
                        w.energy += 0.4; 
                    }
                }
                w.energy = Math.max(0, Math.min(100, w.energy));

                if (w.isPlayer) {
                    document.getElementById('boostBar').style.width = w.energy + '%';
                    
                    // เปลี่ยนสีหลอดตอนหมดแรงเพื่อบอกผู้เล่น
                    if (w.exhausted) {
                        document.getElementById('boostBar').style.background = '#888'; // สีเทา
                        document.getElementById('boostText').style.color = '#ff3b30';
                        document.getElementById('boostText').innerText = "EXHAUSTED!";
                    } else if (w.energy < 25) {
                        document.getElementById('boostBar').style.background = 'red';
                        document.getElementById('boostText').style.color = 'white';
                        document.getElementById('boostText').innerText = "BOOST ENERGY";
                    } else {
                        document.getElementById('boostBar').style.background = 'linear-gradient(90deg, #ffcc00, #ff3b30)';
                        document.getElementById('boostText').style.color = 'white';
                        document.getElementById('boostText').innerText = "BOOST ENERGY";
                    }
                }

                let angleDiff = w.targetAngle - w.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                let rotationSpeed = actuallyBoosting ? 0.06 : 0.1;
                w.angle += angleDiff * rotationSpeed;

                w.x += Math.cos(w.angle) * w.speed;
                w.y += Math.sin(w.angle) * w.speed;

                let currentSpacing = actuallyBoosting ? w.segmentSpacing * 1.5 : w.segmentSpacing;
                
                w.history.unshift({ x: w.x, y: w.y });
                if (w.history.length > w.length * currentSpacing) {
                    w.history.splice(Math.floor(w.length * currentSpacing));
                }

                if (w.x < 0 || w.x > WORLD_SIZE || w.y < 0 || w.y > WORLD_SIZE) {
                    killWorm(w);
                }
            }

            for (let i = 0; i < worms.length; i++) {
                let w1 = worms[i];
                if (w1.dead) continue;

                for (let j = 0; j < worms.length; j++) {
                    if (i === j) continue; 
                    let w2 = worms[j];
                    if (w2.dead) continue;

                    let actuallyBoostingW2 = w2.isBoosting && !w2.exhausted && w2.energy > 0;
                    let currentSpacing = actuallyBoostingW2 ? w2.segmentSpacing * 1.5 : w2.segmentSpacing;
                    
                    for (let k = 0; k < w2.history.length; k += Math.floor(currentSpacing)) {
                        const pos = w2.history[k];
                        if (!pos) continue;
                        const dist = Math.hypot(w1.x - pos.x, w1.y - pos.y);
                        if (dist < w1.radius + w2.radius * 0.7) {
                            killWorm(w1);
                            break;
                        }
                    }
                }
            }

            for (let i = 0; i < worms.length; i++) {
                let w = worms[i];
                if (w.dead) continue;

                for (let j = foods.length - 1; j >= 0; j--) {
                    let f = foods[j];
                    if (Math.hypot(w.x - f.x, w.y - f.y) < w.radius + f.radius) {
                        foods.splice(j, 1);
                        w.length += 1;
                        w.radius = Math.min(45, 15 + (w.length * 0.05));
                        
                        if (w.isPlayer) {
                            score += Math.floor(f.radius);
                            document.getElementById('score').innerText = score;
                        }
                        
                        if (foods.length < FOOD_COUNT) spawnFood();
                    }
                }
            }

            worms = worms.filter(w => !w.dead || w.isPlayer);
        }

        function killWorm(w) {
            w.dead = true;
            let actuallyBoosting = w.isBoosting && !w.exhausted && w.energy > 0;
            let currentSpacing = actuallyBoosting ? w.segmentSpacing * 1.5 : w.segmentSpacing;
            for (let i = 0; i < w.history.length; i += Math.floor(currentSpacing)) {
                if(w.history[i]) spawnFood(w.history[i].x, w.history[i].y, w.color, 1.5);
            }
            
            if (w.isPlayer) {
                isGameOver = true;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('finalScore').innerText = score;
                document.getElementById('boostContainer').style.display = 'none';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            
            let camX = player.x, camY = player.y;
            if (player.dead && player.history.length > 0) {
                camX = player.history[0].x; camY = player.history[0].y;
            }
            ctx.translate(width / 2 - camX, height / 2 - camY);

            ctx.strokeStyle = '#2a2a36'; ctx.lineWidth = 2;
            const gridSize = 100;
            const startX = Math.floor((camX - width/2) / gridSize) * gridSize;
            const endX = startX + width + gridSize;
            const startY = Math.floor((camY - height/2) / gridSize) * gridSize;
            const endY = startY + height + gridSize;

            ctx.beginPath();
            for (let x = startX; x <= endX; x += gridSize) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for (let y = startY; y <= endY; y += gridSize) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();

            ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 15;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            foods.forEach(f => {
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color; ctx.fill();
            });

            worms.sort((a, b) => a.isPlayer ? 1 : -1).forEach(w => {
                if (w.dead) return;
                
                let actuallyBoosting = w.isBoosting && !w.exhausted && w.energy > 0;
                let currentSpacing = actuallyBoosting ? w.segmentSpacing * 1.5 : w.segmentSpacing;
                
                for (let i = w.history.length - 1; i >= 0; i -= Math.floor(currentSpacing)) {
                    const pos = w.history[i];
                    if (pos) {
                        ctx.beginPath(); ctx.arc(pos.x, pos.y, w.radius * 0.9, 0, Math.PI * 2);
                        ctx.fillStyle = w.color; ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
                    }
                }

                ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                ctx.fillStyle = w.isPlayer ? '#00cc70' : w.color; ctx.fill(); ctx.stroke();

                const eyeOffset = w.radius * 0.6;
                const eyeRadius = w.radius * 0.3;
                const leftEyeX = w.x + Math.cos(w.angle - 0.6) * eyeOffset;
                const leftEyeY = w.y + Math.sin(w.angle - 0.6) * eyeOffset;
                const rightEyeX = w.x + Math.cos(w.angle + 0.6) * eyeOffset;
                const rightEyeY = w.y + Math.sin(w.angle + 0.6) * eyeOffset;

                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeRadius, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeRadius, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = 'black';
                const pupilOffset = eyeRadius * 0.4;
                ctx.beginPath(); ctx.arc(leftEyeX + Math.cos(w.angle)*pupilOffset, leftEyeY + Math.sin(w.angle)*pupilOffset, eyeRadius*0.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(rightEyeX + Math.cos(w.angle)*pupilOffset, rightEyeY + Math.sin(w.angle)*pupilOffset, eyeRadius*0.5, 0, Math.PI*2); ctx.fill();
            });

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
